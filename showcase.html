<title>Text Editor Showcase</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #eef1fa;
  --surface: #ffffff;
  --text: #0f172a;
  --text-muted: #64748b;
  --border: #d6dae8;
  --accent: #6366f1;
  --accent-muted: #eef0ff;
  --accent-glow: rgba(99,102,241,.2);
  --panel-shadow: 0 4px 24px rgba(0,0,0,.06);
  --dot-color: rgba(99,102,241,.05);
  --term-bg: #07091a;
  --term-surface: #0e1230;
  --term-text: #cbd5e1;
  --term-green: #34d399;
  --term-yellow: #fbbf24;
  --term-red: #f87171;
  --term-blue: #60a5fa;
  --term-muted: #475569;
  --code-bg: #0b0f1a;
  --node-bg: #6366f1;
  --node-text: #fff;
  --node-new: #10b981;
  --node-del: #ef4444;
  --node-edit: #f59e0b;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg: #040818; --surface: #0c1130; --text: #e2e8f0; --text-muted: #94a3b8;
  --border: #1a2350; --accent: #818cf8; --accent-muted: rgba(129,140,248,.1);
  --accent-glow: rgba(129,140,248,.15); --panel-shadow: 0 4px 32px rgba(0,0,0,.3);
  --dot-color: rgba(129,140,248,.03);
  --code-bg: #060a16; --term-bg: #030510; --term-surface: #080c22;
  color-scheme: dark;
}}
:root[data-theme="dark"]{
  --bg: #040818; --surface: #0c1130; --text: #e2e8f0; --text-muted: #94a3b8;
  --border: #1a2350; --accent: #818cf8; --accent-muted: rgba(129,140,248,.1);
  --accent-glow: rgba(129,140,248,.15); --panel-shadow: 0 4px 32px rgba(0,0,0,.3);
  --dot-color: rgba(129,140,248,.03);
  --code-bg: #060a16; --term-bg: #030510; --term-surface: #080c22;
  color-scheme: dark;
}

html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  background-image:radial-gradient(circle,var(--dot-color) 1px,transparent 1px);
  background-size:24px 24px;
  font-family:'Inter',system-ui,sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;display:flex;flex-direction:column;
}

.app{display:flex;flex-direction:column;height:100%;min-height:0;gap:0}
.app-header{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:14px 0;flex-wrap:wrap;gap:8px;
  border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--accent),transparent) 1;
}
.app-header h1{font-size:18px;font-weight:800;letter-spacing:-.03em;margin:0}
.app-header h1 span{color:var(--accent);font-weight:400}
.header-badge{
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  background:var(--accent);color:#fff;padding:4px 14px;border-radius:100px;
  display:flex;align-items:center;gap:6px;box-shadow:0 2px 12px var(--accent-glow);
}
.badge-dot{width:6px;height:6px;border-radius:50%;background:#34d399;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

.panels{flex:1;display:flex;gap:12px;min-height:0;padding:12px 0}
.terminal-wrap{flex:1;min-width:0;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--panel-shadow)}
.term-chrome{
  background:var(--term-surface);display:flex;align-items:center;gap:8px;padding:10px 14px;
  border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;
}
.term-dots{display:flex;gap:6px}
.term-dots span{width:10px;height:10px;border-radius:50%}
.term-dots .r{background:#ef4444} .term-dots .y{background:#f59e0b} .term-dots .g{background:#22c55e}
.term-title{color:#94a3b8;font-size:12px;font-family:'JetBrains Mono',monospace}

.term-body{
  flex:1;background:radial-gradient(ellipse at 50% 20%,#0d1230,var(--term-bg) 70%);display:flex;flex-direction:column;min-height:0;
}
.term-output{
  flex:1;overflow-y:auto;padding:12px 14px;font-family:'JetBrains Mono',monospace;
  font-size:13px;line-height:1.65;
}
.term-output::-webkit-scrollbar{width:6px}
.term-output::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}

.tl{white-space:pre-wrap;word-break:break-word}
.tl-header{color:#fff;font-weight:700;text-shadow:0 0 12px rgba(255,255,255,.15)}
.tl-green{color:var(--term-green);text-shadow:0 0 8px rgba(52,211,153,.3)}
.tl-yellow{color:var(--term-yellow);text-shadow:0 0 8px rgba(251,191,36,.3)}
.tl-red{color:var(--term-red);text-shadow:0 0 8px rgba(248,113,113,.3)}
.tl-blue{color:var(--term-blue);text-shadow:0 0 8px rgba(96,165,250,.3)}
.tl-muted{color:var(--term-muted)} .tl-echo{color:#94a3b8;opacity:.7}
.tl-prompt{color:var(--term-green)}

.term-input-row{
  display:flex;align-items:center;gap:6px;padding:8px 14px;
  background:var(--term-surface);border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;
}
.term-input-row .prompt-label{
  color:var(--term-green);font-family:'JetBrains Mono',monospace;font-size:13px;
  white-space:nowrap;flex-shrink:0;
}
#input{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--term-text);font-family:'JetBrains Mono',monospace;font-size:13px;
  caret-color:var(--term-green);
}

.side{flex:1;min-width:0;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--surface);box-shadow:var(--panel-shadow)}
.tab-bar{
  display:flex;border-bottom:1px solid var(--border);flex-shrink:0;
  background:var(--surface);overflow-x:auto;
}
.tab-btn{
  padding:10px 16px;font-size:12px;font-weight:600;border:none;background:transparent;
  color:var(--text-muted);cursor:pointer;white-space:nowrap;position:relative;
  font-family:'Inter',system-ui,sans-serif;transition:color .2s,background .2s;
}
.tab-btn:hover{color:var(--text);background:var(--accent-muted)}
.tab-btn.active{color:var(--accent)}
.tab-btn.active::after{
  content:'';position:absolute;bottom:0;left:12px;right:12px;height:2px;
  background:var(--accent);border-radius:2px 2px 0 0;
}
.tab-panel{flex:1;overflow:auto;min-height:0}

.viz-panel{padding:16px;display:flex;flex-direction:column;gap:16px}
.viz-empty{
  text-align:center;padding:40px 20px;color:var(--text-muted);
  font-family:'JetBrains Mono',monospace;font-size:13px;
}
.viz-empty b{display:block;font-size:18px;color:var(--text);margin-bottom:8px;font-family:'Inter',system-ui,sans-serif}

.ll-chain{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px}
.ll-ptr{display:flex;flex-direction:column;align-items:center;gap:0;align-self:center;margin-right:2px}
.ptr-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);background:var(--accent-muted);padding:2px 10px;border-radius:4px}
.ptr-arrow{color:var(--accent);font-weight:700;font-size:14px;font-family:'JetBrains Mono',monospace}
.ll-node{
  border-radius:10px;overflow:hidden;font-family:'JetBrains Mono',monospace;font-size:12px;
  box-shadow:0 4px 20px rgba(99,102,241,.15),0 0 0 1px rgba(99,102,241,.1);
  transition:all .4s cubic-bezier(.4,0,.2,1);
  animation:nodeIn .45s cubic-bezier(.34,1.56,.64,1);min-width:150px;
}
@keyframes nodeIn{from{opacity:0;transform:scale(.7) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.ll-node .n-head{display:flex;justify-content:space-between;padding:4px 10px;color:var(--node-text);font-size:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.ll-node .n-type{font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.ll-node .n-addr{opacity:.6;font-size:9px}
.ll-node .n-body{background:var(--surface);padding:6px 10px;display:flex;flex-direction:column;gap:4px}
.ll-node .n-field{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ll-node .n-key{color:var(--accent);font-weight:600;font-size:10px}
.ll-node .n-val{color:var(--text);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100px}
.ll-node.hl-new .n-head{background:linear-gradient(135deg,#10b981,#059669)}
.ll-node.hl-new{box-shadow:0 4px 24px rgba(16,185,129,.35),0 0 0 2px rgba(16,185,129,.25);transform:scale(1.04)}
.ll-node.hl-del .n-head{background:linear-gradient(135deg,#ef4444,#dc2626)}
.ll-node.hl-del{box-shadow:0 4px 24px rgba(239,68,68,.3);opacity:.75;transform:scale(.95)}
.ll-node.hl-edit .n-head{background:linear-gradient(135deg,#f59e0b,#d97706)}
.ll-node.hl-edit{box-shadow:0 4px 24px rgba(245,158,11,.3)}
.ll-conn{display:flex;align-items:center;flex-shrink:0;align-self:center}

.viz-stats{
  display:flex;gap:16px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--border);
}
.stat{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:5px}
.stat b{color:var(--text);font-variant-numeric:tabular-nums}
.st-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

.code-scroll{background:var(--code-bg);font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7}
.code-fn{padding:2px 0;border-left:3px solid transparent;transition:background .3s,border-color .3s}
.code-fn.active{background:rgba(99,102,241,.07);border-left-color:var(--accent)}
.code-fn .fn-label{
  display:none;padding:2px 12px 2px 48px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;color:var(--accent);
}
.code-fn.active .fn-label{display:block}
.cl{display:flex;padding:0 12px}
.cl-num{min-width:36px;text-align:right;padding-right:12px;color:#4b5563;user-select:none}
.cl-code{flex:1;white-space:pre;min-width:0;overflow-x:auto}
.hl-kw{color:#c084fc} .hl-str{color:#34d399} .hl-num{color:#fb923c}
.hl-fn{color:#60a5fa} .hl-cmt{color:#6b7280;font-style:italic} .hl-pre{color:#f472b6}

.algo-panel{padding:16px;display:flex;flex-direction:column;gap:8px}
.algo-title{font-size:14px;font-weight:700;margin-bottom:4px}
.algo-idle{color:var(--text-muted);font-size:13px;padding:20px 0;text-align:center}
.algo-step{
  display:flex;align-items:flex-start;gap:8px;padding:6px 10px;border-radius:6px;
  font-size:13px;transition:background .2s;
}
.algo-step .a-icon{flex-shrink:0;width:18px;text-align:center;font-size:14px}
.algo-step.pending .a-icon{color:var(--text-muted)}
.algo-step.active{background:var(--accent-muted)}
.algo-step.active .a-icon{color:var(--accent)}
.algo-step.done .a-icon{color:var(--term-green)}
.algo-step .a-text{flex:1}
.algo-step .a-detail{font-size:11px;color:var(--text-muted);margin-top:1px}

.status-bar{
  flex-shrink:0;display:flex;align-items:center;gap:16px;padding:10px 0;
  border-top:1px solid var(--border);font-size:11px;color:var(--text-muted);
  font-family:'JetBrains Mono',monospace;flex-wrap:wrap;
}
.status-bar b{color:var(--text);font-variant-numeric:tabular-nums}
.status-bar .st{display:flex;align-items:center;gap:5px}
.status-bar .st-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

@media(max-width:768px){
  .panels{flex-direction:column;gap:8px}
  .terminal-wrap,.side{flex:none;height:50vh;min-height:200px}
  .app-header h1{font-size:14px}
}
</style>

<div class="app">
  <header class="app-header">
    <h1>Text Editor in C <span>/ Interactive Showcase</span></h1>
    <div class="header-badge"><span class="badge-dot"></span>Live</div>
  </header>

  <div class="panels">
    <div class="terminal-wrap">
      <div class="term-chrome">
        <div class="term-dots"><span class="r"></span><span class="y"></span><span class="g"></span></div>
        <span class="term-title">text_editor</span>
      </div>
      <div class="term-body">
        <div class="term-output" id="output"></div>
        <div class="term-input-row">
          <span class="prompt-label" id="prompt-label">Choice:</span>
          <input type="text" id="input" autocomplete="off" spellcheck="false" autofocus>
        </div>
      </div>
    </div>

    <div class="side">
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="viz">Linked List</button>
        <button class="tab-btn" data-tab="code">Source Code</button>
        <button class="tab-btn" data-tab="algo">Algorithm</button>
      </div>
      <div class="tab-panel" id="tab-viz">
        <div class="viz-panel" id="viz"></div>
      </div>
      <div class="tab-panel" id="tab-code" hidden>
        <div class="code-scroll" id="code-display"></div>
      </div>
      <div class="tab-panel" id="tab-algo" hidden>
        <div class="algo-panel" id="algo"></div>
      </div>
    </div>
  </div>

  <div class="status-bar" id="status">
    <span class="st"><span class="st-dot" style="background:var(--accent)"></span>Nodes: <b id="st-nodes">0</b></span>
    <span class="st"><span class="st-dot" style="background:#34d399"></span>Memory: <b id="st-mem">0 B</b></span>
    <span class="st"><span class="st-dot" style="background:#60a5fa"></span>Files: <b id="st-files">0</b></span>
    <span class="st"><span class="st-dot" style="background:#fbbf24"></span>Op: <b id="st-op">idle</b></span>
  </div>
</div>

<script>
const C_SRC = [
  {id:'headers',label:'Headers & Defines',code:`#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\n#define MAX_LINE 1024`},
  {id:'struct',label:'struct Line',code:`struct Line {\n    char text[MAX_LINE];\n    struct Line *next;\n};`},
  {id:'globals',label:'Global Variables',code:`struct Line *head = NULL;\nint total_lines = 0;`},
  {id:'create_line',label:'create_line()',code:`struct Line *create_line(char *text) {\n    struct Line *new_line = (struct Line *)malloc(sizeof(struct Line));\n    if (new_line == NULL) {\n        printf("Memory allocation failed!\\n");\n        exit(1);\n    }\n    strcpy(new_line->text, text);\n    new_line->next = NULL;\n    return new_line;\n}`},
  {id:'insert_at_end',label:'insert_at_end()',code:`void insert_at_end(char *text) {\n    struct Line *new_line = create_line(text);\n    if (head == NULL) {\n        head = new_line;\n    } else {\n        struct Line *current = head;\n        while (current->next != NULL) {\n            current = current->next;\n        }\n        current->next = new_line;\n    }\n    total_lines++;\n    printf("Line added at position %d.\\n", total_lines);\n}`},
  {id:'insert_at_position',label:'insert_at_position()',code:`void insert_at_position(int position, char *text) {\n    if (position < 1 || position > total_lines + 1) {\n        printf("Invalid position! Valid range: 1 to %d\\n", total_lines + 1);\n        return;\n    }\n    struct Line *new_line = create_line(text);\n    if (position == 1) {\n        new_line->next = head;\n        head = new_line;\n    } else {\n        struct Line *current = head;\n        for (int i = 1; i < position - 1; i++) {\n            current = current->next;\n        }\n        new_line->next = current->next;\n        current->next = new_line;\n    }\n    total_lines++;\n    printf("Line inserted at position %d.\\n", position);\n}`},
  {id:'delete_line',label:'delete_line()',code:`void delete_line(int position) {\n    if (head == NULL) {\n        printf("No lines to delete!\\n");\n        return;\n    }\n    if (position < 1 || position > total_lines) {\n        printf("Invalid position! Valid range: 1 to %d\\n", total_lines);\n        return;\n    }\n    struct Line *to_delete;\n    if (position == 1) {\n        to_delete = head;\n        head = head->next;\n    } else {\n        struct Line *current = head;\n        for (int i = 1; i < position - 1; i++) {\n            current = current->next;\n        }\n        to_delete = current->next;\n        current->next = to_delete->next;\n    }\n    printf("Deleted line %d: %s\\n", position, to_delete->text);\n    free(to_delete);\n    total_lines--;\n}`},
  {id:'display_lines',label:'display_lines()',code:`void display_lines() {\n    if (head == NULL) {\n        printf("No lines in the editor.\\n");\n        return;\n    }\n    printf("\\n--- Editor Contents ---\\n");\n    struct Line *current = head;\n    int line_number = 1;\n    while (current != NULL) {\n        printf("%3d | %s\\n", line_number, current->text);\n        current = current->next;\n        line_number++;\n    }\n    printf("--- Total: %d lines ---\\n", total_lines);\n}`},
  {id:'save_to_file',label:'save_to_file()',code:`void save_to_file(char *filename) {\n    FILE *file = fopen(filename, "w");\n    if (file == NULL) {\n        printf("Error: Could not open file '%s' for writing.\\n", filename);\n        return;\n    }\n    struct Line *current = head;\n    while (current != NULL) {\n        fprintf(file, "%s\\n", current->text);\n        current = current->next;\n    }\n    fclose(file);\n    printf("Saved %d lines to '%s'.\\n", total_lines, filename);\n}`},
  {id:'free_all_lines',label:'free_all_lines()',code:`void free_all_lines() {\n    struct Line *current = head;\n    while (current != NULL) {\n        struct Line *temp = current;\n        current = current->next;\n        free(temp);\n    }\n    head = NULL;\n    total_lines = 0;\n}`},
  {id:'load_from_file',label:'load_from_file()',code:`void load_from_file(char *filename) {\n    FILE *file = fopen(filename, "r");\n    if (file == NULL) {\n        printf("Error: Could not open file '%s' for reading.\\n", filename);\n        return;\n    }\n    free_all_lines();\n    char buffer[MAX_LINE];\n    while (fgets(buffer, MAX_LINE, file) != NULL) {\n        buffer[strcspn(buffer, "\\n")] = '\\0';\n        insert_at_end(buffer);\n    }\n    fclose(file);\n    printf("Loaded %d lines from '%s'.\\n", total_lines, filename);\n}`},
  {id:'edit_line',label:'edit_line()',code:`void edit_line(int position) {\n    if (position < 1 || position > total_lines) {\n        printf("Invalid position! Valid range: 1 to %d\\n", total_lines);\n        return;\n    }\n    struct Line *current = head;\n    for (int i = 1; i < position; i++) {\n        current = current->next;\n    }\n    printf("Current text: %s\\n", current->text);\n    printf("Enter new text: ");\n    char buffer[MAX_LINE];\n    fgets(buffer, MAX_LINE, stdin);\n    buffer[strcspn(buffer, "\\n")] = '\\0';\n    strcpy(current->text, buffer);\n    printf("Line %d updated.\\n", position);\n}`},
  {id:'show_menu',label:'show_menu()',code:`void show_menu() {\n    printf("\\n===== TEXT EDITOR =====\\n");\n    printf("1. Insert line at end\\n");\n    printf("2. Insert line at position\\n");\n    printf("3. Delete a line\\n");\n    printf("4. Edit a line\\n");\n    printf("5. Display all lines\\n");\n    printf("6. Save to file\\n");\n    printf("7. Load from file\\n");\n    printf("8. Exit\\n");\n    printf("Choice: ");\n}`},
  {id:'main',label:'main()',code:`int main() {\n    int choice, position;\n    char buffer[MAX_LINE];\n    char filename[256];\n\n    printf("Welcome to the Text Editor!\\n");\n\n    while (1) {\n        show_menu();\n        scanf("%d", &choice);\n        getchar();\n\n        switch (choice) {\n            case 1:\n                printf("Enter text: ");\n                fgets(buffer, MAX_LINE, stdin);\n                buffer[strcspn(buffer, "\\n")] = '\\0';\n                insert_at_end(buffer);\n                break;\n            case 2:\n                printf("Enter position (1 to %d): ", total_lines + 1);\n                scanf("%d", &position);\n                getchar();\n                printf("Enter text: ");\n                fgets(buffer, MAX_LINE, stdin);\n                buffer[strcspn(buffer, "\\n")] = '\\0';\n                insert_at_position(position, buffer);\n                break;\n            case 3:\n                display_lines();\n                printf("Enter line number to delete: ");\n                scanf("%d", &position);\n                getchar();\n                delete_line(position);\n                break;\n            case 4:\n                display_lines();\n                printf("Enter line number to edit: ");\n                scanf("%d", &position);\n                getchar();\n                edit_line(position);\n                break;\n            case 5:\n                display_lines();\n                break;\n            case 6:\n                printf("Enter filename: ");\n                fgets(filename, 256, stdin);\n                filename[strcspn(filename, "\\n")] = '\\0';\n                save_to_file(filename);\n                break;\n            case 7:\n                printf("Enter filename to load: ");\n                fgets(filename, 256, stdin);\n                filename[strcspn(filename, "\\n")] = '\\0';\n                load_from_file(filename);\n                break;\n            case 8:\n                free_all_lines();\n                printf("Goodbye!\\n");\n                return 0;\n            default:\n                printf("Invalid choice! Try again.\\n");\n        }\n    }\n    return 0;\n}`}
];

const ALGOS = {
  insert_at_end:{name:'Insert at End',fns:['create_line','insert_at_end'],steps:[
    {t:'Allocate memory for new node',d:'malloc(sizeof(struct Line))'},
    {t:'Copy text into node',d:'strcpy(new_line->text, text)'},
    {t:'Set new_line->next = NULL',d:'Not connected yet'},
    {t:'Check if head == NULL',d:'Is the list empty?'},
    {t:'Traverse to last node',d:'while (current->next != NULL)'},
    {t:'Attach new node at end',d:'last->next = new_line'},
    {t:'Increment total_lines',d:'total_lines++'}
  ]},
  insert_at_position:{name:'Insert at Position',fns:['create_line','insert_at_position'],steps:[
    {t:'Validate position range',d:'1 to total_lines + 1'},
    {t:'Allocate memory for new node',d:'malloc(sizeof(struct Line))'},
    {t:'If position == 1: new becomes head',d:'new_line->next = head; head = new_line'},
    {t:'Else: walk to node before target',d:'for loop to position - 1'},
    {t:'Rewire pointers',d:'new->next = current->next; current->next = new'},
    {t:'Increment total_lines',d:'total_lines++'}
  ]},
  delete_line:{name:'Delete Line',fns:['delete_line'],steps:[
    {t:'Check if list is empty',d:'head == NULL?'},
    {t:'Validate position range',d:'1 to total_lines'},
    {t:'If position == 1: move head forward',d:'head = head->next'},
    {t:'Else: walk to node before target',d:'for loop to position - 1'},
    {t:'Save target & skip over it',d:'current->next = to_delete->next'},
    {t:'Free deleted node memory',d:'free(to_delete)'},
    {t:'Decrement total_lines',d:'total_lines--'}
  ]},
  edit_line:{name:'Edit Line',fns:['edit_line'],steps:[
    {t:'Validate position range',d:'1 to total_lines'},
    {t:'Walk to target node',d:'for loop to position'},
    {t:'Show current text',d:'printf current->text'},
    {t:'Read new text from user',d:'fgets(buffer, MAX_LINE, stdin)'},
    {t:'Overwrite node text',d:'strcpy(current->text, buffer)'}
  ]},
  display_lines:{name:'Display All Lines',fns:['display_lines'],steps:[
    {t:'Check if list is empty',d:'head == NULL?'},
    {t:'Start at head node',d:'current = head'},
    {t:'Print line number and text',d:'printf("%3d | %s", ...)'},
    {t:'Move to next node',d:'current = current->next'},
    {t:'Repeat until NULL',d:'while (current != NULL)'}
  ]},
  save_to_file:{name:'Save to File',fns:['save_to_file'],steps:[
    {t:'Open file in write mode',d:'fopen(filename, "w")'},
    {t:'Walk list from head',d:'current = head'},
    {t:'Write each line to file',d:'fprintf(file, "%s\\n", ...)'},
    {t:'Close file',d:'fclose(file)'}
  ]},
  load_from_file:{name:'Load from File',fns:['free_all_lines','load_from_file'],steps:[
    {t:'Open file in read mode',d:'fopen(filename, "r")'},
    {t:'Free existing list',d:'free_all_lines()'},
    {t:'Read lines with fgets',d:'fgets(buffer, MAX_LINE, file)'},
    {t:'Strip newline with strcspn',d:'buffer[strcspn(...)] = \'\\0\''},
    {t:'Insert each line at end',d:'insert_at_end(buffer)'},
    {t:'Close file',d:'fclose(file)'}
  ]},
  free_all_lines:{name:'Free All Lines',fns:['free_all_lines'],steps:[
    {t:'Start at head',d:'current = head'},
    {t:'Save current in temp',d:'temp = current'},
    {t:'Move current forward',d:'current = current->next'},
    {t:'Free temp',d:'free(temp)'},
    {t:'Repeat until NULL',d:'Loop ends when current == NULL'},
    {t:'Reset head and counter',d:'head = NULL; total_lines = 0'}
  ]}
};

let head = null, total_lines = 0;
const vfs = {};
let state = 'menu', tempPos = 0, tempEditNode = null;
let activeFns = [], activeAlgo = null;
const NODE_SIZE = 1032;

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function hlC(code){
  const KW = new Set(['int','char','void','struct','if','else','while','for','return','switch','case','break','default','NULL','sizeof','exit','FILE','define','include']);
  let r='',i=0;
  while(i<code.length){
    if(code[i]==='"'){let e=i+1;while(e<code.length&&code[e]!=='"'){if(code[e]==='\\')e++;e++}
      r+=`<span class="hl-str">${esc(code.slice(i,e+1))}</span>`;i=e+1;
    }else if(code[i]==='/'&&code[i+1]==='/'){let e=code.indexOf('\n',i);if(e===-1)e=code.length;
      r+=`<span class="hl-cmt">${esc(code.slice(i,e))}</span>`;i=e;
    }else if(code[i]==='#'&&(i===0||code[i-1]==='\n')){let e=code.indexOf('\n',i);if(e===-1)e=code.length;
      r+=`<span class="hl-pre">${esc(code.slice(i,e))}</span>`;i=e;
    }else if(/[a-zA-Z_]/.test(code[i])){let e=i;while(e<code.length&&/[a-zA-Z0-9_]/.test(code[e]))e++;
      const w=code.slice(i,e);
      if(KW.has(w))r+=`<span class="hl-kw">${w}</span>`;
      else if(e<code.length&&code[e]==='(')r+=`<span class="hl-fn">${esc(w)}</span>`;
      else r+=esc(w);i=e;
    }else if(/[0-9]/.test(code[i])){let e=i;while(e<code.length&&/[0-9]/.test(code[e]))e++;
      r+=`<span class="hl-num">${code.slice(i,e)}</span>`;i=e;
    }else{r+=esc(code[i]);i++}
  }
  return r;
}

function buildCodePanel(){
  const el=document.getElementById('code-display');
  let lineNum=1,html='';
  for(const block of C_SRC){
    const lines=block.code.split('\n');
    html+=`<div class="code-fn" id="cf-${block.id}"><div class="fn-label">${esc(block.label)}</div>`;
    for(const line of lines){
      html+=`<div class="cl"><span class="cl-num">${lineNum}</span><span class="cl-code">${hlC(line)}</span></div>`;
      lineNum++;
    }
    html+='</div>';
    lineNum++;
  }
  el.innerHTML=html;
}

function highlightFns(ids){
  activeFns=ids;
  document.querySelectorAll('.code-fn').forEach(el=>{
    el.classList.toggle('active',ids.includes(el.id.replace('cf-','')));
  });
  if(ids.length){
    const target=document.getElementById('cf-'+ids[ids.length-1]);
    if(target)target.scrollIntoView({behavior:'smooth',block:'center'});
  }
}

function showAlgo(key){
  activeAlgo=key;
  const el=document.getElementById('algo');
  if(!key||!ALGOS[key]){el.innerHTML='<div class="algo-idle">Choose a menu option to see its algorithm steps</div>';return;}
  const a=ALGOS[key];
  let html=`<div class="algo-title">${esc(a.name)}</div>`;
  a.steps.forEach((s,i)=>{
    html+=`<div class="algo-step done" id="as-${i}"><span class="a-icon">&#10003;</span><div><div class="a-text">${esc(s.t)}</div>${s.d?`<div class="a-detail">${esc(s.d)}</div>`:''}</div></div>`;
  });
  el.innerHTML=html;
}

function renderViz(hlIndex,hlClass){
  const el=document.getElementById('viz');
  if(!head){
    el.innerHTML=`<div class="viz-empty"><svg width="180" height="44" viewBox="0 0 180 44" style="margin:0 auto 12px;display:block"><rect x="0" y="10" width="52" height="24" rx="6" fill="var(--accent)" opacity=".15" stroke="var(--accent)" stroke-width="1.5"/><text x="26" y="26" text-anchor="middle" font-size="10" font-weight="700" fill="var(--accent)" font-family="JetBrains Mono,monospace">head</text><line x1="58" y1="22" x2="100" y2="22" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4"/><text x="130" y="27" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text-muted)" font-family="JetBrains Mono,monospace">NULL</text></svg><b>Empty Linked List</b><p style="color:var(--text-muted);margin:4px 0 0;font-size:13px">Insert a line to watch the data structure grow</p></div>`+statsHTML();
    return;
  }
  let html='<div class="ll-chain"><div class="ll-ptr"><span class="ptr-label">head</span><span class="ptr-arrow">&darr;</span></div>';
  let cur=head,idx=0;
  while(cur){
    const cls=(idx===hlIndex&&hlClass)?` ${hlClass}`:'';
    const txt=cur.text.length>18?cur.text.slice(0,16)+'…':cur.text;
    const addr='0x'+(0x7f00+idx*0x10).toString(16);
    const nxt=cur.next?'0x'+(0x7f00+(idx+1)*0x10).toString(16):'NULL';
    html+=`<div class="ll-node${cls}"><div class="n-head"><span class="n-type">struct Line</span><span class="n-addr">${addr}</span></div><div class="n-body"><div class="n-field"><span class="n-key">text</span><span class="n-val">"${esc(txt)}"</span></div><div class="n-field"><span class="n-key">next</span><span class="n-val">${nxt}</span></div></div></div>`;
    if(cur.next)html+='<div class="ll-conn"><svg width="28" height="16" viewBox="0 0 28 16"><path d="M2 8h18m-5-5 5 5-5 5" stroke="var(--accent)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
    cur=cur.next;idx++;
  }
  html+='</div>'+statsHTML();
  el.innerHTML=html;
}

function statsHTML(){
  return `<div class="viz-stats"><span class="stat"><span class="st-dot" style="background:var(--accent)"></span>Nodes: <b>${total_lines}</b></span><span class="stat"><span class="st-dot" style="background:#34d399"></span>Memory: <b>${fmtBytes(total_lines*NODE_SIZE)}</b></span><span class="stat"><span class="st-dot" style="background:#fbbf24"></span>sizeof: <b>1032 B</b></span></div>`;
}

function fmtBytes(b){if(b===0)return '0 B';if(b<1024)return b+' B';return (b/1024).toFixed(1)+' KB';}

function updateStatus(op){
  document.getElementById('st-nodes').textContent=total_lines;
  document.getElementById('st-mem').textContent=fmtBytes(total_lines*NODE_SIZE);
  document.getElementById('st-files').textContent=Object.keys(vfs).length;
  document.getElementById('st-op').textContent=op||'idle';
}

const out=document.getElementById('output');
const inp=document.getElementById('input');

function print(text,cls){
  const d=document.createElement('div');
  d.className='tl'+(cls?' '+cls:'');
  d.textContent=text;
  out.appendChild(d);
  out.scrollTop=out.scrollHeight;
}

function printMenu(){
  print('');
  print('===== TEXT EDITOR =====','tl-header');
  print('1. Insert line at end');
  print('2. Insert line at position');
  print('3. Delete a line');
  print('4. Edit a line');
  print('5. Display all lines');
  print('6. Save to file');
  print('7. Load from file');
  print('8. Exit');
}

function setPrompt(t){document.getElementById('prompt-label').textContent=t;}

function insert_at_end(text){
  const n={text,next:null};
  if(!head){head=n;}else{let c=head;while(c.next)c=c.next;c.next=n;}
  total_lines++;
  print(`Line added at position ${total_lines}.`,'tl-green');
  renderViz(total_lines-1,'hl-new');
  setTimeout(()=>renderViz(),1200);
  highlightFns(['create_line','insert_at_end']);
  showAlgo('insert_at_end');
  updateStatus('insert_at_end');
}

function insert_at_position(pos,text){
  if(pos<1||pos>total_lines+1){print(`Invalid position! Valid range: 1 to ${total_lines+1}`,'tl-red');return false;}
  const n={text,next:null};
  if(pos===1){n.next=head;head=n;}
  else{let c=head;for(let i=1;i<pos-1;i++)c=c.next;n.next=c.next;c.next=n;}
  total_lines++;
  print(`Line inserted at position ${pos}.`,'tl-green');
  renderViz(pos-1,'hl-new');
  setTimeout(()=>renderViz(),1200);
  highlightFns(['create_line','insert_at_position']);
  showAlgo('insert_at_position');
  updateStatus('insert_at_position');
  return true;
}

function delete_line(pos){
  if(!head){print('No lines to delete!','tl-red');return false;}
  if(pos<1||pos>total_lines){print(`Invalid position! Valid range: 1 to ${total_lines}`,'tl-red');return false;}
  renderViz(pos-1,'hl-del');
  let del;
  if(pos===1){del=head;head=head.next;}
  else{let c=head;for(let i=1;i<pos-1;i++)c=c.next;del=c.next;c.next=del.next;}
  print(`Deleted line ${pos}: ${del.text}`,'tl-yellow');
  total_lines--;
  setTimeout(()=>renderViz(),600);
  highlightFns(['delete_line']);
  showAlgo('delete_line');
  updateStatus('delete_line');
  return true;
}

function display_lines(){
  if(!head){print('No lines in the editor.','tl-muted');return;}
  print('');
  print('--- Editor Contents ---','tl-blue');
  let c=head,n=1;
  while(c){print(`  ${String(n).padStart(3)} | ${c.text}`);c=c.next;n++;}
  print(`--- Total: ${total_lines} lines ---`,'tl-blue');
  highlightFns(['display_lines']);
  showAlgo('display_lines');
  updateStatus('display_lines');
}

function save_to_file(fn){
  if(!head){vfs[fn]='';print(`Saved 0 lines to '${fn}'.`,'tl-green');}
  else{let lines=[];let c=head;while(c){lines.push(c.text);c=c.next;}
    vfs[fn]=lines.join('\n');print(`Saved ${total_lines} lines to '${fn}'.`,'tl-green');}
  highlightFns(['save_to_file']);
  showAlgo('save_to_file');
  updateStatus('save_to_file');
}

function load_from_file(fn){
  if(!(fn in vfs)){print(`Error: Could not open file '${fn}' for reading.`,'tl-red');return;}
  let c=head;while(c){let t=c;c=c.next;} head=null;total_lines=0;
  const content=vfs[fn];
  if(content){content.split('\n').forEach(line=>{
    const n={text:line,next:null};
    if(!head)head=n;else{let c=head;while(c.next)c=c.next;c.next=n;}
    total_lines++;
  });}
  print(`Loaded ${total_lines} lines from '${fn}'.`,'tl-green');
  renderViz();
  highlightFns(['free_all_lines','load_from_file']);
  showAlgo('load_from_file');
  updateStatus('load_from_file');
}

function edit_line(pos,newText){
  if(pos<1||pos>total_lines){print(`Invalid position! Valid range: 1 to ${total_lines}`,'tl-red');return false;}
  let c=head;for(let i=1;i<pos;i++)c=c.next;
  c.text=newText;
  print(`Line ${pos} updated.`,'tl-green');
  renderViz(pos-1,'hl-edit');
  setTimeout(()=>renderViz(),1200);
  highlightFns(['edit_line']);
  showAlgo('edit_line');
  updateStatus('edit_line');
  return true;
}

function processInput(val){
  print('> '+val,'tl-echo');
  switch(state){
    case 'menu':{
      const ch=parseInt(val);
      if(isNaN(ch)||ch<1||ch>8){print('Invalid choice! Try again.','tl-red');setPrompt('Choice:');break;}
      highlightFns(['main','show_menu']);
      switch(ch){
        case 1:setPrompt('Enter text:');state='insert_text';break;
        case 2:setPrompt(`Position (1-${total_lines+1}):`);state='insert_pos_num';break;
        case 3:display_lines();setPrompt('Line to delete:');state='delete_num';break;
        case 4:display_lines();setPrompt('Line to edit:');state='edit_num';break;
        case 5:display_lines();setPrompt('Choice:');break;
        case 6:setPrompt('Filename:');state='save_fn';break;
        case 7:setPrompt('Filename:');state='load_fn';break;
        case 8:
          let c=head;while(c){let t=c;c=c.next;}head=null;total_lines=0;
          print('Goodbye!','tl-green');
          highlightFns(['free_all_lines','main']);showAlgo('free_all_lines');
          renderViz();updateStatus('exit');
          setTimeout(()=>{
            head=null;total_lines=0;
            print('');print('--- Program restarted ---','tl-blue');print('Welcome to the Text Editor!','tl-green');
            printMenu();setPrompt('Choice:');state='menu';
            highlightFns([]);showAlgo(null);renderViz();updateStatus('idle');
          },1500);
          return;
      }
      break;
    }
    case 'insert_text':
      insert_at_end(val);state='menu';setPrompt('Choice:');printMenu();break;
    case 'insert_pos_num':{
      const p=parseInt(val);
      if(isNaN(p)){print('Invalid input! Enter a number.','tl-red');break;}
      tempPos=p;setPrompt('Enter text:');state='insert_pos_text';break;
    }
    case 'insert_pos_text':
      insert_at_position(tempPos,val);state='menu';setPrompt('Choice:');printMenu();break;
    case 'delete_num':{
      const p=parseInt(val);
      if(isNaN(p)){print('Invalid input! Enter a number.','tl-red');break;}
      delete_line(p);state='menu';setPrompt('Choice:');printMenu();break;
    }
    case 'edit_num':{
      const p=parseInt(val);
      if(isNaN(p)){print('Invalid input! Enter a number.','tl-red');break;}
      if(p<1||p>total_lines){print(`Invalid position! Valid range: 1 to ${total_lines}`,'tl-red');state='menu';setPrompt('Choice:');printMenu();break;}
      tempPos=p;
      let c=head;for(let i=1;i<p;i++)c=c.next;
      print(`Current text: ${c.text}`,'tl-yellow');
      setPrompt('New text:');state='edit_text';break;
    }
    case 'edit_text':
      edit_line(tempPos,val);state='menu';setPrompt('Choice:');printMenu();break;
    case 'save_fn':
      save_to_file(val);state='menu';setPrompt('Choice:');printMenu();break;
    case 'load_fn':
      load_from_file(val);state='menu';setPrompt('Choice:');printMenu();break;
  }
}

inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const v=inp.value;inp.value='';
    if(v.trim()!=='')processInput(v.trim());
  }
});

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(p=>p.hidden=true);
    document.getElementById('tab-'+btn.dataset.tab).hidden=false;
  });
});

document.addEventListener('click',()=>inp.focus());

buildCodePanel();
print('Welcome to the Text Editor!','tl-green');
printMenu();
setPrompt('Choice:');
renderViz();
showAlgo(null);
updateStatus('idle');
inp.focus();
</script>
